name: Deploy Docs to GitHub Pages

on:
  # Trigger on pushes to main
  push:
    branches: [ main ]
    paths:
      - "web/**"
      - ".github/workflows/deploy-docs.yml"
  # Allow manual trigger
  workflow_dispatch:

# Default permissions for all jobs
permissions:
  contents: read

# Prevent concurrent deployments
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      - name: Resolve template placeholders
        working-directory: web
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/resolve-placeholders.mjs --no-backup

      - name: Build site
        working-directory: web
        run: npm run build

      - name: Verify no unresolved tokens in build output
        working-directory: web
        run: |
          FOUND=$(grep -rl '{{' dist --include='*.html' --include='*.xml' --include='*.css' --include='*.js' --exclude-dir=pagefind || true)
          if [ -n "$FOUND" ]; then
            echo "Error: Built output still contains unresolved template tokens:"
            echo "$FOUND"
            exit 1
          fi
          echo "Build output is clean — no unresolved tokens found."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: web/dist

  pages-check:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check whether GitHub Pages is enabled
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/pages")
          if [ "$code" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages is not enabled::Enable Pages in Settings > Pages with the GitHub Actions source to publish the docs site."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    needs: [ build, pages-check ]
    if: needs.pages-check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
