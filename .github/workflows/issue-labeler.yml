name: Issue Labeler

on:
  issues:
    types: [opened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dallay/common-actions/.github/workflows/issue-labeler.yml@main
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          config-path: .github/issue-labeler-config.yml
