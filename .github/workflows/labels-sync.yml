name: Sync Labels

on:
  push:
    branches: [main]
    paths: [.github/labels.yml]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dallay/common-actions/.github/workflows/labels-sync.yml@main
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
