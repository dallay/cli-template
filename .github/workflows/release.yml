name: Release

on:
  push:
    branches: [ main ]

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          release-type: rust

  build-binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          target: ${{ matrix.target }}
      - name: Install aarch64 cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu musl-tools
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      - name: Set executable permission
        if: matrix.os != 'windows-latest'
        run: chmod +x target/${{ matrix.target }}/release/cli-template
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binaries-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/cli-template${{ matrix.os == 'windows-latest' && '.exe' || '' }}
          retention-days: 1
          if-no-files-found: error

  upload-assets:
    needs: [ release-please, build-binaries ]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: binaries-*
          path: artifacts
      - name: Rename binaries to unique release asset names
        shell: bash
        run: |
          for dir in artifacts/binaries-*/; do
            target="${dir#artifacts/binaries-}"
            target="${target%/}"
            for file in "$dir"*; do
              case "$file" in
                *.exe) mv "$file" "artifacts/cli-template-${target}.exe" ;;
                *) mv "$file" "artifacts/cli-template-${target}" ;;
              esac
            done
            rmdir "$dir"
          done
      - name: Set executable permissions
        run: find artifacts -type f ! -name '*.exe' -exec chmod +x {} \;
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  publish-crates:
    needs: [ release-please, build-binaries ]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-npm-binaries:
    needs: [ release-please, build-binaries ]
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            npm_os: linux
            npm_arch: x64
          - target: x86_64-apple-darwin
            npm_os: darwin
            npm_arch: x64
          - target: x86_64-pc-windows-msvc
            npm_os: win32
            npm_arch: x64
          - target: aarch64-unknown-linux-gnu
            npm_os: linux
            npm_arch: arm64
          - target: aarch64-apple-darwin
            npm_os: darwin
            npm_arch: arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: binaries-${{ matrix.target }}
          path: npm-binaries
      - name: Create npm package
        run: |
          mkdir -p npm-${{ matrix.npm_os }}-${{ matrix.npm_arch }}/bin
          sed "s/{{VERSION}}/${{ needs.release-please.outputs.version }}/g; s/{{OS}}/${{ matrix.npm_os }}/g; s/{{ARCH}}/${{ matrix.npm_arch }}/g" npm/package.json.tmpl > npm-${{ matrix.npm_os }}-${{ matrix.npm_arch }}/package.json
          cp npm-binaries/* npm-${{ matrix.npm_os }}-${{ matrix.npm_arch }}/bin/
          chmod +x npm-${{ matrix.npm_os }}-${{ matrix.npm_arch }}/bin/*
          cd npm-${{ matrix.npm_os }}-${{ matrix.npm_arch }}
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-npm-base:
    needs: [ release-please, publish-npm-binaries ]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        working-directory: npm/cli-template
        run: npm ci --ignore-scripts
      - name: Set package version and platform dependencies
        working-directory: npm/cli-template
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          npm pkg set version="$VERSION"
          for pkg in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64; do
            npm pkg set "optionalDependencies.@dallay/cli-template-$pkg=$VERSION"
          done
      - name: Build, check and publish base package
        working-directory: npm/cli-template
        run: |
          npm run build
          npm run check:package
          npm run release-package
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-docker:
    needs: [ release-please, build-binaries ]
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-summary:
    needs: [ release-please, upload-assets, publish-crates, publish-npm-base, publish-docker ]
    if: always() && needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Release summary
        run: |
          echo "## 🚀 Release ${{ needs.release-please.outputs.tag_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- $([ "${{ needs.upload-assets.result }}" = "success" ] && echo "✅" || echo "❌") Binaries uploaded to GitHub Release" >> $GITHUB_STEP_SUMMARY
          echo "- $([ "${{ needs.publish-crates.result }}" = "success" ] && echo "✅" || echo "❌") Published to crates.io" >> $GITHUB_STEP_SUMMARY
          echo "- $([ "${{ needs.publish-npm-base.result }}" = "success" ] && echo "✅" || echo "❌") Published to npm" >> $GITHUB_STEP_SUMMARY
          echo "- $([ "${{ needs.publish-docker.result }}" = "success" ] && echo "✅" || echo "❌") Docker image pushed" >> $GITHUB_STEP_SUMMARY
