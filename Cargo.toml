[package]
name = "cli-template"
version = "0.1.4"
edition = "2021"
rust-version = "1.70"
description = "A Rust CLI template project"
authors = ["Your Name"]
license = "MIT"
repository = "https://github.com/dallay/cli-template"
keywords = ["cli", "tool"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = true
strip = true
opt-level = 3

[[bin]]
name = "cli-template"
path = "src/main.rs"

[lib]
name = "cli_template"
path = "src/lib.rs"
